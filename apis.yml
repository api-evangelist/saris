name: Saris
description: Saris (saris.ai) is an enterprise AI company building AI workflow agents
  for banks and credit unions. Its platform automates multi-step back-office processes
  across lending, compliance, and operations — document processing, data validation,
  core-system updates, and compliance tracking — while keeping humans in control with
  full audit trails. Saris integrates with financial-technology platforms such as
  Fiserv and with model providers including OpenAI and Anthropic, and is a recommended
  CCUA partner for Northeast credit unions. The company raised a $28.8M Series A and
  is backed by 8vc. As of this enrichment pass Saris exposes no public API, developer
  portal, or documentation surface.
